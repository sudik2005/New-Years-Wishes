<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enkutatash 2019 — QR Code Sheet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow:      #d4a017;
      --yellow-soft: #e8b820;
      --yellow-pale: #fdf3d0;
      --green-light: #4aab38;
      --green-dark:  #1e5c2a;
      --green-pale:  #e8f5e4;
      --navy:        #1a2540;
      --text:        #1c2636;
      --text-muted:  #7a8494;
      --border:      #e2e5ea;
      --bg:          #f7f5f0;
      --card:        #ffffff;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 36px 24px 60px;
    }

    /* ── Config bar ── */
    .config-bar {
      max-width: 900px;
      margin: 0 auto 36px;
      background: var(--card);
      border-radius: 18px;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07), 0 0 0 1px var(--border);
    }
    .config-bar h1 {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      color: var(--navy);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .config-row {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .config-label {
      font-size: 0.73rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .url-input {
      flex: 1;
      min-width: 240px;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #f9f9f7;
      color: var(--text);
      font-family: "Inter", monospace;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .url-input:focus {
      border-color: var(--yellow-soft);
      box-shadow: 0 0 0 3px rgba(232,184,32,0.15);
    }
    .url-input::placeholder { color: #b0b8c4; }
    .btn-generate {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, var(--yellow-soft), var(--green-light));
      color: #fff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(74,171,56,0.25);
    }
    .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-print {
      padding: 10px 22px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .btn-print:hover { background: var(--bg); color: var(--text); }
    .status-pill {
      font-size: 0.72rem;
      padding: 4px 14px;
      border-radius: 100px;
      background: var(--green-pale);
      border: 1px solid rgba(74,171,56,0.3);
      color: var(--green-dark);
      display: none;
      font-weight: 600;
    }
    .status-pill.show { display: inline-block; }

    /* ── Grid ── */
    .grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 18px;
    }

    /* ── QR card ── */
    .qr-card {
      background: var(--card);
      border-radius: 16px;
      padding: 24px 18px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .qr-card:hover { transform: translateY(-3px); box-shadow: 0 6px 24px rgba(0,0,0,0.1); }

    .qr-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--yellow-soft), var(--green-light));
    }

    .qr-flower { font-size: 1.5rem; line-height: 1; }

    .qr-name {
      font-family: "Playfair Display", serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      line-height: 1.3;
    }
    .qr-full-name {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 400;
      text-align: center;
      letter-spacing: 0.02em;
    }
    .qr-nick-badge {
      font-size: 0.62rem;
      padding: 2px 10px;
      border-radius: 100px;
      background: var(--yellow-pale);
      border: 1px solid rgba(212,160,23,0.4);
      color: var(--yellow);
      font-weight: 600;
      letter-spacing: 0.05em;
      display: none;
    }
    .qr-nick-badge.show { display: inline-block; }

    .qr-box {
      width: 144px;
      height: 144px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafaf8;
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 8px;
    }
    .qr-box canvas, .qr-box img { border-radius: 4px; }

    .qr-placeholder {
      width: 128px; height: 128px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 0.68rem; color: #c0c8d0;
      font-style: italic; line-height: 1.6;
    }

    .qr-url-label {
      font-size: 0.56rem;
      color: #c0c8d0;
      text-align: center;
      word-break: break-all;
      max-width: 160px;
      line-height: 1.5;
      font-family: monospace;
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; padding: 10mm; }
      .config-bar { display: none !important; }
      .grid { max-width: 100%; grid-template-columns: repeat(4, 1fr); gap: 10mm; }
      .qr-card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; padding: 16px 14px 14px; }
      .qr-card:hover { transform: none; box-shadow: none; }
      .qr-box { width: 130px; height: 130px; }
      .qr-url-label { display: none; }
      @page { margin: 15mm; }
    }
  </style>
</head>
<body>

  <!-- Config bar -->
  <div class="config-bar" id="config-bar">
    <h1>🌼 Enkutatash 2019 — QR Code Sheet</h1>
    <div class="config-row">
      <span class="config-label">Site URL</span>
      <input
        class="url-input"
        id="base-url"
        type="url"
        placeholder="https://your-app.vercel.app"
        value=""
      />
      <button class="btn-generate" onclick="generateAll()">Generate QR Codes</button>
      <button class="btn-print" onclick="window.print()">🖨 Print Sheet</button>
      <span class="status-pill" id="status-pill">✓ Generated!</span>
    </div>
  </div>

  <!-- QR grid -->
  <div class="grid" id="qr-grid"></div>

  <script>
    /* ═══════════════════════════════════════
       GUEST LIST
       display  = shown on the card label
       urlName  = used in ?name= param
       fullName = printed beneath (family name)
       nick     = shown as badge if set
    ═══════════════════════════════════════ */
    const GUESTS = [
      { display: "Selam",    urlName: "Selam",    fullName: "Selam Meseret",          nick: null },
      { display: "Biruk",    urlName: "Biruk",    fullName: "Biruk Meseret",          nick: null },
      { display: "Momi",     urlName: "Momi",     fullName: "Bezaye Meseret",         nick: "Bezaye" },
      { display: "Gashaye",  urlName: "Gashaye",  fullName: "Gashaye Nuresa",         nick: null },
      { display: "Babi",     urlName: "Babi",     fullName: "Mintesnot Tadesse",      nick: "Mintesnot" },
      { display: "Ayate Aba", urlName: "Ayate Aba", fullName: "Meseret Adnew",  nick: "Ayate Aba" },
      { display: "Ayate Ama", urlName: "Ayate Ama", fullName: "Birhane Agaze",  nick: "Ayate Ama" },
      { display: "Nardos",   urlName: "Nardos",   fullName: "Nardos Asfeha",          nick: null },
    ];

    /* Build initial empty cards */
    function buildGrid() {
      const grid = document.getElementById("qr-grid");
      grid.innerHTML = "";
      GUESTS.forEach(function(g, i) {
        const card = document.createElement("div");
        card.className = "qr-card";
        card.innerHTML =
          '<div class="qr-flower">🌼</div>' +
          '<div class="qr-name">' + g.display + '</div>' +
          (g.nick ? '<span class="qr-nick-badge show">' + g.fullName.split(" ")[0] + ' &rsaquo; ' + g.display + '</span>' : '<span class="qr-full-name">' + g.fullName + '</span>') +
          '<div class="qr-box" id="qr-box-' + i + '">' +
            '<div class="qr-placeholder">Enter your<br/>Vercel URL<br/>above</div>' +
          '</div>' +
          '<div class="qr-url-label" id="qr-url-' + i + '"></div>';
        grid.appendChild(card);
      });
    }

    /* Generate all QR codes */
    function generateAll() {
      var raw = document.getElementById("base-url").value.trim();
      if (!raw) { alert("Please paste your Vercel URL first!"); return; }

      // Normalise: strip trailing slash
      raw = raw.replace(/\/+$/, "");

      GUESTS.forEach(function(g, i) {
        var fullUrl = raw + "/?name=" + encodeURIComponent(g.urlName);

        var box = document.getElementById("qr-box-" + i);
        box.innerHTML = "";          // clear placeholder / old QR

        new QRCode(box, {
          text:         fullUrl,
          width:        128,
          height:       128,
          colorDark:    "#0a0f1e",
          colorLight:   "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });

        var label = document.getElementById("qr-url-" + i);
        label.textContent = fullUrl;
      });

      var pill = document.getElementById("status-pill");
      pill.classList.add("show");
      setTimeout(function(){ pill.classList.remove("show"); }, 3000);
    }

    /* Auto-generate if URL is prefilled from localStorage */
    window.addEventListener("DOMContentLoaded", function() {
      buildGrid();
      var saved = localStorage.getItem("enkutatash_url");
      if (saved) {
        document.getElementById("base-url").value = saved;
        generateAll();
      }
    });

    /* Save URL to localStorage whenever it changes */
    document.getElementById("base-url") && null; // deferred — element not yet in DOM at parse time
    window.addEventListener("DOMContentLoaded", function() {
      document.getElementById("base-url").addEventListener("input", function() {
        localStorage.setItem("enkutatash_url", this.value);
      });
    });
  </script>
</body>
</html>
