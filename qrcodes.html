<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enkutatash 2019 — QR Code Sheet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", sans-serif;
      background: #f4f1eb;
      color: #1c2636;
      padding: 36px 20px 60px;
      min-height: 100vh;
    }

    /* ── Page header ── */
    .page-header {
      max-width: 960px;
      margin: 0 auto 20px;
    }
    .page-title {
      font-family: "Playfair Display", serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: #1c2636;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ── Config bar ── */
    .config-bar {
      max-width: 960px;
      margin: 0 auto 32px;
      background: #ffffff;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      border: 1px solid #e3dfd7;
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .config-label {
      font-size: 0.71rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9aa0ab;
      white-space: nowrap;
    }
    .url-input {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      border-radius: 8px;
      border: 1.5px solid #dddad4;
      background: #faf8f4;
      color: #1c2636;
      font-size: 0.86rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .url-input:focus {
      border-color: #d4a017;
      box-shadow: 0 0 0 3px rgba(212,160,23,0.13);
    }
    .url-input::placeholder { color: #bbb8b0; }

    .btn-generate {
      padding: 9px 20px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #d4a017 0%, #3d9c2c 100%);
      color: #fff;
      font-weight: 700;
      font-size: 0.83rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      box-shadow: 0 2px 8px rgba(61,156,44,0.22);
      transition: opacity 0.18s, transform 0.15s;
    }
    .btn-generate:hover { opacity: 0.88; transform: translateY(-1px); }

    .btn-print {
      padding: 9px 18px;
      border-radius: 8px;
      border: 1.5px solid #dddad4;
      background: #ffffff;
      color: #6b7280;
      font-weight: 600;
      font-size: 0.83rem;
      cursor: pointer;
      transition: background 0.18s, color 0.18s;
    }
    .btn-print:hover { background: #f4f1eb; color: #1c2636; }

    .status-pill {
      font-size: 0.71rem;
      padding: 4px 14px;
      border-radius: 100px;
      background: #e8f5e4;
      border: 1px solid #a8d9a0;
      color: #2d7a22;
      display: none;
      font-weight: 600;
    }
    .status-pill.show { display: inline-block; }

    /* ── Grid ── */
    .grid {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    /* ── QR card ── */
    .qr-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      border: 1px solid #e3dfd7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .qr-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.09); }

    /* top stripe */
    .qr-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #d4a017 0%, #3d9c2c 100%);
    }

    .qr-flower { font-size: 1.5rem; margin-top: 2px; }

    .qr-name {
      font-family: "Playfair Display", serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a2540;
      text-align: center;
      line-height: 1.25;
    }

    .qr-full-name {
      font-size: 0.67rem;
      color: #9aa0ab;
      text-align: center;
      letter-spacing: 0.02em;
    }

    /* QR code wrapper — white background so code is always scannable */
    .qr-box {
      width: 152px;
      height: 152px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 12px;
      border: 1.5px solid #e3dfd7;
      padding: 10px;
      margin-top: 4px;
    }
    .qr-box canvas, .qr-box img { display: block; border-radius: 4px; }

    .qr-placeholder {
      width: 132px; height: 132px;
      display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: 0.68rem; color: #c8c5be;
      font-style: italic; line-height: 1.7;
    }

    .qr-url-label {
      font-size: 0.53rem;
      color: #c0bdb6;
      text-align: center;
      word-break: break-all;
      max-width: 175px;
      line-height: 1.5;
      font-family: monospace;
    }

    /* ── Print ── */
    @media print {
      body { background: #fff; padding: 8mm; }
      .config-bar, .page-header { display: none !important; }
      .grid { max-width: 100%; grid-template-columns: repeat(4, 1fr); gap: 8mm; }
      .qr-card {
        box-shadow: none;
        border: 1px solid #ddd;
        break-inside: avoid;
        padding: 12px 10px 14px;
        gap: 8px;
        border-radius: 10px;
      }
      .qr-card:hover { transform: none; }
      .qr-box { width: 134px; height: 134px; border: 1px solid #e0e0e0; }
      .qr-url-label { display: none; }
      @page { margin: 12mm; size: A4; }
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div class="page-title">🌼 &nbsp;Enkutatash 2019 — QR Code Sheet</div>
  </div>

  <div class="config-bar" id="config-bar">
    <span class="config-label">Site URL</span>
    <input
      class="url-input"
      id="base-url"
      type="url"
      placeholder="https://your-app.vercel.app"
    />
    <button class="btn-generate" id="btn-gen" onclick="generateAll()">⚡ Generate QR Codes</button>
    <button class="btn-print" onclick="window.print()">🖨 Print Sheet</button>
    <span class="status-pill" id="status-pill">✓ All 8 generated!</span>
  </div>

  <div class="grid" id="qr-grid"></div>

  <script>
    var GUESTS = [
      { display: "Selam",     urlName: "Selam",     fullName: "Selam Meseret" },
      { display: "Biruk",     urlName: "Biruk",     fullName: "Biruk Meseret" },
      { display: "Momi",      urlName: "Momi",      fullName: "Bezaye Meseret" },
      { display: "Gashaye",   urlName: "Gashaye",   fullName: "Gashaye Nuresa" },
      { display: "Babi",      urlName: "Babi",      fullName: "Mintesnot Tadesse" },
      { display: "Ayate Aba", urlName: "Ayate Aba", fullName: "Meseret Adnew" },
      { display: "Ayate Ama", urlName: "Ayate Ama", fullName: "Birhane Agaze" },
      { display: "Nardos",    urlName: "Nardos",    fullName: "Nardos Asfeha" },
    ];

    function buildGrid() {
      var grid = document.getElementById("qr-grid");
      grid.innerHTML = "";
      GUESTS.forEach(function(g, i) {
        var card = document.createElement("div");
        card.className = "qr-card";
        card.innerHTML =
          '<div class="qr-flower">🌼</div>' +
          '<div class="qr-name">' + g.display + '</div>' +
          '<div class="qr-full-name">' + g.fullName + '</div>' +
          '<div class="qr-box" id="qr-box-' + i + '">' +
            '<div class="qr-placeholder">Paste your<br/>Vercel URL<br/>above ↑</div>' +
          '</div>' +
          '<div class="qr-url-label" id="qr-url-' + i + '"></div>';
        grid.appendChild(card);
      });
    }

    function generateAll() {
      var raw = document.getElementById("base-url").value.trim();
      if (!raw) { alert("Paste your Vercel URL first!"); return; }
      raw = raw.replace(/\/+$/, "");

      GUESTS.forEach(function(g, i) {
        var url = raw + "/?name=" + encodeURIComponent(g.urlName);
        var box = document.getElementById("qr-box-" + i);
        box.innerHTML = "";

        /* QR rendered with dark modules on WHITE — always scannable */
        new QRCode(box, {
          text:         url,
          width:        132,
          height:       132,
          colorDark:    "#1a2540",   /* dark navy modules */
          colorLight:   "#ffffff",   /* white background  */
          correctLevel: QRCode.CorrectLevel.H
        });

        document.getElementById("qr-url-" + i).textContent = url;
      });

      var pill = document.getElementById("status-pill");
      pill.classList.add("show");
      setTimeout(function(){ pill.classList.remove("show"); }, 3000);
    }

    window.addEventListener("DOMContentLoaded", function() {
      buildGrid();
      var saved = localStorage.getItem("enkutatash_url");
      if (saved) {
        document.getElementById("base-url").value = saved;
        generateAll();
      }
      document.getElementById("base-url").addEventListener("input", function() {
        localStorage.setItem("enkutatash_url", this.value);
      });
    });
  </script>
</body>
</html>
